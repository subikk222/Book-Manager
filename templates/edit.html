<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>Edit Book</h1>

    <form method="POST" class="book-form">

        <label for='image'>Image:</label>
        <input
            type="text"
            id="image"
            name="image"
            value="{{ book['image'] }}"
            required
        >

        <label for='title'>Title:</label>
        <input
            type="text"
            id="title"
            name="title"
            value="{{ book['title'] }}"
            required
        >

        <label for="author">Author</label>
        <input
            type="text"
            id="author"
            name="author"
            value="{{ book['author'] }}"
            required
        >

        <label for="year">Year</label>
        <input
            type="number"
            id="year"
            name="year"
            value="{{ book['year'] }}"
            required
        >

        <label for="genre">Genre</label>
        <input
            type="year"
            id="genre"
            name="genre"
            value="{{ book['year'] }}"
            required
        >

        <button type="submit">Save Changes</button>
        <a href="{{ url_for('index') }}" class="button secondary">
            Cancel
        </a>

    </form>
</div>

</body>
</html>
